version: "3"
services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgresdata:/var/lib/postgresql/
    privileged: true

  appserver:
    container_name: server
    image: yonatanovadia/online-bookstore:backend-latest
    ports:
      - "8080:8080"
    depends_on:
      - db

  client:
    image: yonatanovadia/online-bookstore:frontend-latest
    ports:
      - "80:80"
    depends_on:
      - appserver