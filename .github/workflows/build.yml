name: CI/CD Pipeline (Backend & Frontend)

on:
  push:
    branches:
      - main

jobs:
  # עבודה 1: באק-אנד (כבר מסודר)
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test with Maven
        working-directory: Online-bookstore
        run: mvn clean install

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./Online-bookstore
          file: ./Online-bookstore/Dockerfile
          push: true
          tags: yonatanovadia/online-bookstore:backend-latest

  # עבודה 2: פרונט-אנד (התיקון כאן למטה)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./Online-bookstore
          file: ./Online-bookstore/client.Dockerfile 
          push: true
          tags: yonatanovadia/online-bookstore:frontend-latest
