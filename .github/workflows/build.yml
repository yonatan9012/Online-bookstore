name: Build and Push Docker Images

on:
  push:
    branches:
      - main # האוטומציה תרוץ בכל פעם שתדחוף קוד לענף main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת הקוד מהריפוזיטורי לתוך השרת של GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. התחברות ל-Docker Hub באמצעות סודות (Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. בנייה ודחיפה של שרת ה-Java (Backend)
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: yonatanovadia/online-bookstore:backend-latest

      # 4. בנייה ודחיפה של הפרונט-אנד (Nginx)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: yonatanovadia/online-bookstore:frontend-latest
